name: Bug report
description: Something in Narabe does not work as the docs say.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. A security problem goes to a private report instead (see SECURITY.md).

  - type: input
    id: narabe
    attributes:
      label: Narabe version
      description: From `mix.lock`, or `mix deps | grep narabe`.
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: stack
    attributes:
      label: Elixir, OTP, Phoenix and LiveView versions
      placeholder: "Elixir 1.20.1, OTP 29, Phoenix 1.8.1, LiveView 1.1.14"
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Where it happens
      options:
        - In the browser (a drag, a finger, the keyboard, a screen reader)
        - On the server (Narabe.Ecto, Narabe.Move, Narabe.Rules, Narabe.Live)
        - The database (Postgres, MySQL, SQLite)
        - Collaboration (Narabe.Issho)
        - Both
        - Narabe.Test
        - mix narabe.install
    validations:
      required: true

  - type: input
    id: component
    attributes:
      label: Component
      description: The component, if any.
      placeholder: "tree"

  - type: input
    id: locale
    attributes:
      label: Locale
      description: The `locale` of the list, and the browser's language.
      placeholder: "ja-JP"

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      description: For what the browser shows or does.
      placeholder: "Safari 26, iOS 26"


  - type: textarea
    id: repro
    attributes:
      label: The smallest list or code that shows it
      description: The component and its attributes and rules, the schema and its `use Narabe.Ordered`, or the call that gives the wrong result. Or a link to a small repository.
      render: elixir
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps
      placeholder: |
        1. Open the Pages tree
        2. Drag "Intro" into the closed "Docs" folder
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: The value posted, the error and its stacktrace, from the server log or the browser console.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I use a release from Hex, not `main`.
          required: true
        - label: I searched the open and closed issues, and the Known limits guide.
          required: true
